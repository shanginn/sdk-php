name: TrueAsync CI

on:
  push:
    branches: [true-async]
  pull_request:
    branches: [true-async]
  workflow_dispatch:

env:
  PHP_PREFIX: /opt/trueasync-php

jobs:
  test:
    name: SDK integration over the native extension (live dev server)
    runs-on: ubuntu-24.04   # libuv >= 1.45 needed by TrueAsync
    steps:
      - uses: actions/checkout@v4

      - name: Capture system dependency tooling
        run: |
          echo "SYSTEM_PHP=$(command -v php)" >> "$GITHUB_ENV"
          echo "COMPOSER_BIN=$(command -v composer)" >> "$GITHUB_ENV"

      - name: Check out the php-temporal extension
        uses: actions/checkout@v4
        with:
          repository: shanginn/php-temporal
          ref: main
          path: php-temporal
          submodules: true

      # ---- TrueAsync PHP (built from the php-src fork, cached by its SHA) ----

      - name: Resolve TrueAsync php-src + php-async revisions
        id: phpsrc
        run: |
          echo "sha=$(git ls-remote https://github.com/true-async/php-src refs/heads/true-async-stable | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "asha=$(git ls-remote https://github.com/true-async/php-async refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache TrueAsync PHP
        id: php-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PHP_PREFIX }}
          key: trueasync-php-v4-${{ runner.os }}-${{ steps.phpsrc.outputs.sha }}-${{ steps.phpsrc.outputs.asha }}

      - name: Build TrueAsync PHP
        if: steps.php-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison re2c libuv1-dev libssl-dev zlib1g-dev libonig-dev libxml2-dev
          git clone --depth 1 --branch true-async-stable https://github.com/true-async/php-src /tmp/php-src
          # ext/true_async lives in its own repo, nested into the php-src tree;
          # without it buildconf does not even know --enable-async.
          git clone --depth 1 https://github.com/true-async/php-async /tmp/php-src/ext/async
          cd /tmp/php-src
          ./buildconf
          # --disable-all must come FIRST: later flags win, so every enable
          # (including --enable-async) has to follow it.
          ./configure --prefix="$PHP_PREFIX" \
            --disable-all --disable-cgi --disable-phpdbg \
            --enable-zts --enable-async \
            --enable-bcmath \
            --enable-sockets --enable-pcntl --enable-posix \
            --enable-mbstring --enable-ctype --enable-filter \
            --enable-tokenizer --enable-phar --enable-session \
            --with-libxml --enable-dom --enable-simplexml \
            --enable-xml --enable-xmlreader --enable-xmlwriter \
            --enable-fileinfo \
            --with-openssl --with-zlib
          make -j"$(nproc)"
          sudo make install

      - name: Use TrueAsync PHP
        run: |
          # libuv1: TrueAsync runtime dep; protobuf-compiler: prost-wkt-types
          # build script in the core c-bridge needs protoc.
          sudo apt-get update && sudo apt-get install -y libuv1 protobuf-compiler
          echo "$PHP_PREFIX/bin" >> "$GITHUB_PATH"
          "$PHP_PREFIX/bin/php" -v
          # Fail fast if the TrueAsync runtime is missing (a silent configure
          # miss otherwise surfaces as cryptic test failures much later).
          "$PHP_PREFIX/bin/php" -r 'exit(function_exists("Async\\await") ? 0 : 1);' \
            || { echo "TrueAsync runtime (ext/async) is not in this PHP build" >&2; exit 1; }

      # ---- The Rust core c-bridge (cargo target dir cached) ----

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: php-temporal/third_party/sdk-rust

      - name: Build the Temporal core c-bridge
        run: cargo build --release -p temporalio-sdk-core-c-bridge --manifest-path php-temporal/third_party/sdk-rust/Cargo.toml

      # ---- The extension ----

      - name: Build the extension
        working-directory: php-temporal
        run: |
          phpize
          ./configure --enable-temporal --with-php-config="$PHP_PREFIX/bin/php-config"
          make -j"$(nproc)"

      - name: Enable the native Temporal extension
        run: |
          echo "extension=$GITHUB_WORKSPACE/php-temporal/modules/temporal.so" > "$GITHUB_WORKSPACE/trueasync-php.ini"
          echo "PHPRC=$GITHUB_WORKSPACE/trueasync-php.ini" >> "$GITHUB_ENV"
          PHPRC="$GITHUB_WORKSPACE/trueasync-php.ini" php -r '
            foreach (["true_async", "temporal"] as $extension) {
                if (!extension_loaded($extension)) {
                    fwrite(STDERR, "Missing required extension: $extension\n");
                    exit(1);
                }
            }
          '

      # ---- SDK dependencies and native test suites ----

      - name: Install SDK dependencies
        run: |
          "$SYSTEM_PHP" "$COMPOSER_BIN" config -g github-oauth.github.com "${{ secrets.GITHUB_TOKEN }}"
          # composer.lock is gitignored upstream (library policy), so this is a
          # full resolution. Composer and composer-patches currently depend on
          # stream callback behaviour PHP 8.6 tightened, so dependency tooling
          # runs under the runner's stock PHP. Only this command's runtime ABI
          # requirements are ignored; all tests still run on TrueAsync PHP.
          "$SYSTEM_PHP" "$COMPOSER_BIN" validate --strict
          "$SYSTEM_PHP" "$COMPOSER_BIN" update --no-interaction --no-progress \
            --ignore-platform-req=php \
            --ignore-platform-req=ext-temporal \
            --ignore-platform-req=ext-true_async

      - name: Download Temporal test binaries
        run: |
          "$SYSTEM_PHP" "$COMPOSER_BIN" get:binaries

      - name: SDK unit tests
        timeout-minutes: 10
        # tests/runner.php exists for a Windows reporting workaround and wraps
        # PHPUnit with passthru(). TrueAsync's Linux process-reaping path can
        # keep that wrapper alive after PHPUnit has already printed OK.
        run: php vendor/bin/phpunit --testsuite=Unit --colors=always --testdox

      - name: SDK functional tests with native worker
        timeout-minutes: 10
        run: php vendor/bin/phpunit --testsuite=Functional --colors=always --testdox

      # ---- Live Temporal dev server and native integration scripts ----

      - name: Start the Temporal dev server
        run: |
          docker run -d --name temporal-dev -p 7233:7233 \
            temporalio/temporal:1.8.1 server start-dev --ip 0.0.0.0 --log-level error
          ready=0
          for i in $(seq 1 60); do
            # A TCP accept happens before the frontend can reliably serve
            # get_system_info. Probe through the same Core connection used by
            # the SDK, and require two consecutive successful handshakes.
            if timeout 5 php -r '
              require "vendor/autoload.php";
              Async\await(Async\spawn(
                  static fn() => new TrueAsync\Temporal\Core\Connection("127.0.0.1:7233"),
              ));
            ' >/dev/null 2>&1; then
              ready=$((ready + 1))
              if [ "$ready" -ge 2 ]; then exit 0; fi
            else
              ready=0
            fi
            sleep 1
          done
          echo "Temporal dev server did not come up" >&2
          docker logs temporal-dev >&2 || true
          exit 1

      - name: SDK integration tests
        run: |
          status=0
          for t in tests/truasync/*.php; do
            echo "::group::$t"
            if ! php "$t"; then
              echo "FAILED: $t"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Stop the external dev server
        if: always()
        run: docker rm -f temporal-dev || true
