# The true-async branch runs its own pipeline (trueasync-ci.yml): it needs
# the TrueAsync PHP build, and upstream auto-fixes must not touch the fork.
on:
  push:
    branches-ignore:
      - 'true-async'

name: Fix Code Style

jobs:
  cs-fix:
    permissions:
      contents: write
    uses: spiral/gh-actions/.github/workflows/cs-fix.yml@master
