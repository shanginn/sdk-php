name: Nexus

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  cancel-in-progress: ${{ !contains(github.ref, 'release/') }}
  group: tests-${{ github.workflow }}-${{ github.ref }}

jobs:
  php81-syntax:
    name: PHP 8.1 Nexus syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out PHP SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.1

      - name: Lint SDK and tests
        run: find src testing tests -name '*.php' -print0 | xargs -0 -n 1 php -l

  acceptance:
    name: Nexus end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEMPORAL_HEADLESS: true
      ROADRUNNER_BINARY: ${{ github.workspace }}/rr-nexus
      ROADRUNNER_REF: 321b817fab1056e404533ca1ddd200e77d1525fd
    steps:
      - name: Check out PHP SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Check out pinned RoadRunner Nexus bridge
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          repository: shanginn/roadrunner-temporal
          ref: 1f84653c28d317ca69b7fe5426ce6e70331a2ca4
          path: roadrunner-temporal

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.4
          cache: false

      - name: Build pinned RoadRunner
        working-directory: roadrunner-temporal
        run: tests/acceptance/build-local.sh

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: dom, sockets, grpc, curl, protobuf

      - name: Install dependencies
        uses: ramsey/composer-install@5c2bcf28d7b060ef3c601d7b476d5430a7b46c27 # v4

      - name: Download Temporal CLI
        run: composer get:binaries

      - name: Run Nexus acceptance suite
        run: composer test:nexus
