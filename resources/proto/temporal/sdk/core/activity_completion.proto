syntax = "proto3";

package coresdk;

// The two request messages the activity worker sends back to the Temporal Rust
// core (sdk-core-c-bridge): `complete_activity_task` and
// `record_activity_heartbeat`.
//
// These are copied verbatim (same package, field numbers and types, so the wire
// format is identical) from the canonical core_interface.proto in the Rust core.
// We do not generate core_interface.proto itself because it bundles these with
// the workflow-completion wrappers and eagerly imports the entire workflow
// proto tree — which the activity worker does not need and which references
// temporal.api.* types newer than the bundled roadrunner-api-dto package ships.
// The workflow worker (phase 3) will generate the full set against a matching
// api-dto version.

import "temporal/api/common/v1/message.proto";
import "temporal/sdk/core/activity_result/activity_result.proto";

// A request as given to `record_activity_heartbeat`.
message ActivityHeartbeat {
    bytes task_token = 1;
    repeated temporal.api.common.v1.Payload details = 2;
}

// A request as given to `complete_activity_task`.
message ActivityTaskCompletion {
    bytes task_token = 1;
    activity_result.ActivityExecutionResult result = 2;
}
